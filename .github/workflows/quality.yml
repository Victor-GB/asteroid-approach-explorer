name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Audit Python dependencies
        run: python -m pip_audit --strict -r requirements-dev.txt

      - name: Run pre-commit checks
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files

      - name: Run completed baseline tests
        run: pytest -q tests/test_python_version.py tests/test_data_files.py --no-cov
