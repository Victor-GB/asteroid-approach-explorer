[tool.ruff]
line-length = 88
target-version = "py312"
force-exclude = true
extend-exclude = [
    "helpers.py",
    "main.py",
    "tests/__init__.py",
    "tests/test_database.py",
    "tests/test_data_files.py",
    "tests/test_extract.py",
    "tests/test_limit.py",
    "tests/test_python_version.py",
    "tests/test_query.py",
    "tests/test_write.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = [
    "database.py",
    "extract.py",
    "filters.py",
    "models.py",
    "write.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["helpers"]
ignore_errors = true


[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=database",
    "--cov=extract",
    "--cov=filters",
    "--cov=models",
    "--cov=write",
    "--cov-branch",
    "--cov-report=term-missing",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
